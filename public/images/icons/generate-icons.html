<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator - SACCO System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .icon-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .icon-item {
            text-align: center;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px 0;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2563eb;
        }
        .instructions {
            background: #f0f9ff;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <h1>🎨 SACCO System Icon Generator</h1>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Click "Generate All Icons" button below</li>
            <li>Right-click each icon and "Save image as..."</li>
            <li>Save with the exact filename shown (e.g., icon-72x72.png)</li>
            <li>Place all icons in the <code>public/images/icons/</code> folder</li>
        </ol>
    </div>
    
    <button onclick="generateAllIcons()">Generate All Icons</button>
    <button onclick="downloadAllIcons()">Download All Icons (ZIP)</button>
    
    <div class="icon-preview" id="iconPreview"></div>
    
    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#1e40af');
            gradient.addColorStop(1, '#3b82f6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);
            
            // Add icon symbol (bank/university icon)
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.5}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🏦', size / 2, size / 2);
            
            // Add text for larger icons
            if (size >= 192) {
                ctx.font = `bold ${size * 0.12}px Arial`;
                ctx.fillText('SACCO', size / 2, size * 0.85);
            }
            
            return canvas;
        }
        
        function generateAllIcons() {
            const preview = document.getElementById('iconPreview');
            preview.innerHTML = '';
            
            sizes.forEach(size => {
                const canvas = generateIcon(size);
                const item = document.createElement('div');
                item.className = 'icon-item';
                
                const title = document.createElement('h4');
                title.textContent = `${size}x${size}`;
                
                const filename = document.createElement('p');
                filename.textContent = `icon-${size}x${size}.png`;
                filename.style.fontSize = '12px';
                filename.style.color = '#666';
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, size);
                
                item.appendChild(title);
                item.appendChild(canvas);
                item.appendChild(filename);
                item.appendChild(downloadBtn);
                preview.appendChild(item);
            });
        }
        
        function downloadIcon(canvas, size) {
            const link = document.createElement('a');
            link.download = `icon-${size}x${size}.png`;
            link.href = canvas.toDataURL();
            link.click();
        }
        
        function downloadAllIcons() {
            sizes.forEach(size => {
                setTimeout(() => {
                    const canvas = generateIcon(size);
                    downloadIcon(canvas, size);
                }, size * 10); // Stagger downloads
            });
        }
        
        // Auto-generate on load
        window.onload = generateAllIcons;
    </script>
</body>
</html>
