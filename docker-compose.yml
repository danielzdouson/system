services:
  db:
    image: mysql:8.1
    container_name: saco_system_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: douglasben
      MYSQL_DATABASE: saco_db
    ports:
      - "3306:3306"       # optional if you want to connect outside Docker
    volumes:
      - db_data:/var/lib/mysql

  php:
    image: php:8.3-apache
    container_name: saco_system_php
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=saco_db
      - DB_USERNAME=root
      - DB_PASSWORD=douglasben
    command: >
      bash -c "
      apt-get update &&
      apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev zlib1g-dev libmariadb-dev &&
      docker-php-ext-configure gd --with-freetype --with-jpeg &&
      docker-php-ext-install gd pdo pdo_mysql &&
      a2enmod rewrite &&
      sed -i 's|/var/www/html|/var/www/html/public|g' /etc/apache2/sites-available/000-default.conf &&
      chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
      chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache &&
      apache2-foreground
      "

volumes:
  db_data: